{{define "content"}}
{{template "topbar" .}}

<h1>Change Password</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{if .Status}}<p class="muted">{{.Status}}</p>{{end}}

<form method="POST" action="/account/password">
  <label>Current password<br><input type="password" name="current_password" required></label>
  <label>New password<br><input type="password" name="new_password" required></label>
  <button type="submit">Change password</button>
</form>

<h2>New-book digest</h2>
<p class="muted">Get a weekly email listing books added to the library.</p>
<form method="POST" action="/account/digest">
  <label><input type="checkbox" name="subscribed" style="width:auto;display:inline" {{if .DigestSubscribed}}checked{{end}}> Email me weekly about new books</label>
  <button type="submit">Save</button>
</form>

<p><a href="/">&laquo; Back to library</a></p>
{{end}}
