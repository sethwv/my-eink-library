{{define "content"}}
<div class="login-card">
  <h1>{{.SiteName}}</h1>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <form method="POST" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Username
      <input type="text" name="username" autocapitalize="off" autocorrect="off" autofocus>
    </label>
    <label>Password
      <input type="password" name="password">
    </label>
    <button type="submit">Log in</button>
  </form>
  {{if .EmailAvailable}}<p><a href="/forgot-password">Forgot password?</a></p>{{else}}<p class="muted">Password reset is unavailable until an administrator configures email.</p>{{end}}
</div>
{{end}}
