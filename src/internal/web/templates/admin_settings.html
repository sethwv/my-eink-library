{{define "content"}}
{{template "topbar" .}}
{{template "admintabs" .}}

<h1>Configuration</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{if .Status}}<p class="muted">{{.Status}}</p>{{end}}

<h2>General</h2>
<div class="table-wrap">
<form method="POST" action="/admin/settings/general">
<table>
<tr><th>Site name</th><td><input type="text" name="site_name" value="{{.SiteName}}" required></td></tr>
<tr><th>Public URL</th><td><input type="text" name="public_url" value="{{.PublicURL}}" placeholder="https://library.example.com"></td></tr>
<tr><th>Cover width (px)</th><td><input type="number" name="cover_width" value="{{.CoverWidth}}" required></td></tr>
<tr><th>Books per page</th><td><input type="number" name="page_size" value="{{.PageSize}}" required></td></tr>
<tr><th>Session length</th><td><input type="text" name="session_ttl" value="{{.SessionTTL}}" placeholder="720h"></td></tr>
<tr><td colspan="2"><button type="submit">Save general settings</button></td></tr>
</table>
</form>
</div>

{{end}}
