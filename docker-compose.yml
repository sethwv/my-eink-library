name: my-sideload-library

services:
  sideload-library:
    image: ghcr.io/sethwv/my-sideload-library:latest
    ports:
      - "8080:8080"
    environment:
      - LIBRARY_PATH=/library
      - DATA_DIR=/data
      - PORT=8080
    volumes:
      - sideload-library-data:/data
    restart: unless-stopped

volumes:
  sideload-library-data:
