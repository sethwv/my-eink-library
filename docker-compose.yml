services:
  eink-library:
    image: ghcr.io/sethwv/my-eink-library:latest
    ports:
      - "8080:8080"
    environment:
      - LIBRARY_USER=reader
      - LIBRARY_PASS=change-me
      - SESSION_SECRET=change-me-too-a-long-random-string
      - LIBRARY_PATH=/library
      - DATA_DIR=/data
      - PORT=8080
    volumes:
      - eink-library-data:/data
    restart: unless-stopped

volumes:
  eink-library-data:
