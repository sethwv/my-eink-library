mocked_hardcover:
  pride:
    description: Elizabeth Bennet is determined to judge character by action, not rank, until a proud stranger makes every encounter more complicated.
  frankenstein:
    description: A young scientist gives life to an extraordinary creature and must confront the consequences of abandoning it.
  dracula:
    description: A circle of friends follows a trail from Transylvania to England to stop a predatory count.
  moby_dick:
    description: Ishmael joins a whaling voyage commanded by a captain consumed by a white whale.
  jane_eyre:
    description: An independent governess finds work at Thornfield Hall, where a guarded employer and a hidden past change her future.

