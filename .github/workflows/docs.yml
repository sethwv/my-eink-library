name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "src/internal/**"
      - "scripts/docs/**"
      - "scripts/screenshots/**"
  workflow_dispatch:
    inputs:
      regenerate_all_versions:
        description: Rebuild every released documentation version from its tag
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      publish_latest:
        required: false
        default: false
        type: boolean
      regenerate_all_versions:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: documentation-publish
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      manifest: ${{ steps.versions.outputs.manifest }}
      latest: ${{ steps.versions.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: versions
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_LATEST: ${{ inputs.publish_latest || 'false' }}
          REGENERATE_ALL: ${{ inputs.regenerate_all_versions || 'false' }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require("node:child_process");
          const tags = execFileSync("git", ["tag", "-l", "v*", "--sort=-v:refname"], { encoding: "utf8" })
            .trim().split("\n").filter((tag) => /^v\d+\.\d+\.\d+$/.test(tag));
          if (tags.length === 0) throw new Error("at least one vX.Y.Z release tag is required");
          const latest = tags[0];
          const allVersions = [...tags, "main"];
          const presentationPaths = [
            ".github/workflows/docs.yml",
            "docs/_config.yml",
            "docs/_includes/head_custom.html",
            "docs/assets/brand/",
            "docs/assets/css/",
            "docs/assets/js/",
            "scripts/docs/",
            "CHANGELOG.md",
          ];
          const capturePaths = ["src/internal/", "scripts/screenshots/"];
          const shouldCompare = process.env.EVENT_NAME === "push" && process.env.BEFORE && !/^0+$/.test(process.env.BEFORE) && process.env.AFTER;
          let comparisonUnavailable = false;
          let changedPaths = [];
          if (shouldCompare) {
            try {
              changedPaths = execFileSync("git", ["diff", "--name-only", process.env.BEFORE, process.env.AFTER], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
            } catch {
              comparisonUnavailable = true;
            }
          }
          const presentationChanged = comparisonUnavailable || changedPaths.some((path) => presentationPaths.some((prefix) => path === prefix || path.startsWith(prefix)));
          const captureChanged = comparisonUnavailable || changedPaths.some((path) => capturePaths.some((prefix) => path === prefix || path.startsWith(prefix)));
          let hasPublishedSite = true;
          try {
            execFileSync("git", ["ls-remote", "--exit-code", "origin", "refs/heads/docs"], { stdio: "ignore" });
          } catch {
            hasPublishedSite = false;
          }
          const selected = process.env.REGENERATE_ALL === "true" || presentationChanged
            ? allVersions
            : process.env.PUBLISH_LATEST === "true" ? [latest, "main"] : ["main"];
          const label = (ref) => ref === "main" ? "Development (main)" : ref;
          const capture = process.env.REGENERATE_ALL === "true" || process.env.PUBLISH_LATEST === "true" || captureChanged || !hasPublishedSite;
          const entries = selected.map((ref) => ({ ref, slug: ref, label: label(ref), capture }));
          const manifest = [
            { slug: "latest", path: "", label: `Latest (${latest})` },
            ...tags.map((ref) => ({ slug: ref, path: ref, label: ref })),
            { slug: "main", path: "main", label: label("main") },
          ];
          process.stdout.write(`matrix=${JSON.stringify({ include: entries })}\n`);
          process.stdout.write(`manifest=${JSON.stringify(manifest)}\n`);
          process.stdout.write(`latest=${latest}\n`);
          NODE

  build:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out shared docs tooling
        uses: actions/checkout@v7
        with:
          path: tooling
      - name: Check out documentation version
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: version
      - name: Check out published screenshots
        if: matrix.capture == false
        uses: actions/checkout@v7
        with:
          ref: docs
          path: published
      - name: Restore published screenshots
        if: matrix.capture == false
        run: >-
          test -d "published/${{ matrix.slug }}/assets/images/generated"
          && rsync -a --delete
          "published/${{ matrix.slug }}/assets/images/generated/"
          "version/docs/assets/images/generated/"
      - if: matrix.capture
        uses: actions/setup-go@v7
        with:
          go-version-file: version/src/go.mod
          cache-dependency-path: version/src/go.sum
      - if: matrix.capture
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: version/scripts/screenshots/package-lock.json
      - if: matrix.capture
        run: npm ci --prefix version/scripts/screenshots
      - id: playwright-cache
        if: matrix.capture
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('version/scripts/screenshots/package-lock.json') }}
      - if: matrix.capture && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --prefix version/scripts/screenshots playwright install --with-deps chromium
      - if: matrix.capture && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --prefix version/scripts/screenshots playwright install chromium
      - if: matrix.capture
        run: npm run fixtures --prefix version/scripts/screenshots -- --output "$RUNNER_TEMP/library"
      - id: build-info
        if: matrix.capture
        run: |
          tag=$(git -C version describe --exact-match --tags --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if test -n "$tag"; then
            version="$tag"
          else
            branch=$(git -C version branch --show-current)
            branch=${branch:-detached}
            version="${branch//\//-}-$(git -C version rev-parse --short HEAD)"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'date=%s\n' "$(git -C version log -1 --format=%as)" >> "$GITHUB_OUTPUT"
      - if: matrix.capture
        run: go build -ldflags="-X main.buildVersion=${{ steps.build-info.outputs.version }} -X main.buildDate=${{ steps.build-info.outputs.date }}" -o "$RUNNER_TEMP/server" ./cmd/server
        working-directory: version/src
      - name: Start fixture server
        if: matrix.capture
        run: >-
          PORT=8080
          LIBRARY_PATH="$RUNNER_TEMP/library"
          DATA_DIR="$RUNNER_TEMP/data"
          LIBRARY_USER=admin
          LIBRARY_PASS=fixture-password
          SESSION_SECRET=fixture-session-secret-for-documentation-captures
          SITE_NAME="my-eink-library"
          "$RUNNER_TEMP/server" >"$RUNNER_TEMP/server.log" 2>&1 &
      - name: Wait for fixture server
        if: matrix.capture
        run: >-
          for attempt in {1..30}; do
          curl --fail --silent http://127.0.0.1:8080/healthz && exit 0;
          printf 'Waiting for fixture server (%s/30)\n' "$attempt";
          sleep 1;
          done;
          cat "$RUNNER_TEMP/server.log";
          exit 1
      - if: matrix.capture
        run: npm run capture --prefix version/scripts/screenshots
        env:
          LIBRARY_USER: admin
          LIBRARY_PASS: fixture-password
          SCREENSHOT_BUILD_TAG: ${{ steps.build-info.outputs.version }}
      - run: >-
          node tooling/scripts/docs/prepare-source.mjs
          version/docs .docs-source version/CONTRIBUTING.md
          tooling/CHANGELOG.md
          tooling/docs
          "${{ matrix.slug }}" "${{ matrix.slug }}" "${{ matrix.ref }}"
          '${{ needs.discover.outputs.manifest }}'
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .docs-source
          destination: _site
      - name: Stage version site
        run: >-
          mkdir -p "artifact/${{ matrix.slug }}"
          && rsync -a --delete _site/ "artifact/${{ matrix.slug }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.slug }}
          path: artifact
      - name: Prepare latest release at the root
        if: matrix.ref == needs.discover.outputs.latest
        run: >-
          node tooling/scripts/docs/prepare-source.mjs
          version/docs .docs-root version/CONTRIBUTING.md
          tooling/CHANGELOG.md
          tooling/docs
          "" latest "${{ matrix.ref }}"
          '${{ needs.discover.outputs.manifest }}'
      - name: Build latest release at the root
        if: matrix.ref == needs.discover.outputs.latest
        uses: actions/jekyll-build-pages@v1
        with:
          source: .docs-root
          destination: _site-root
      - name: Stage latest release root site
        if: matrix.ref == needs.discover.outputs.latest
        run: >-
          mkdir -p root-artifact/root
          && rsync -a --delete _site-root/ root-artifact/root/
      - name: Upload latest release root site
        if: matrix.ref == needs.discover.outputs.latest
        uses: actions/upload-artifact@v4
        with:
          name: docs-root
          path: root-artifact

  publish:
    needs: [discover, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out docs configuration
        uses: actions/checkout@v7
        with:
          path: tooling
      - name: Restore previous documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          git clone --depth 1 --branch docs
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previous-docs
          || true
      - uses: actions/download-artifact@v5
        with:
          pattern: docs-*
          path: incoming
          merge-multiple: true
      - name: Assemble published sites
        env:
          REGENERATE_ALL: ${{ inputs.regenerate_all_versions || 'false' }}
          LATEST: ${{ needs.discover.outputs.latest }}
        run: |
          mkdir publish
          if test "$REGENERATE_ALL" != "true" && test -d previous-docs; then rsync -a --exclude=.git previous-docs/ publish/; fi
          for artifact in incoming/*; do
            slug="${artifact##*/}"
            if test "$slug" = root; then continue; fi
            rm -rf "publish/$slug"
            mkdir -p "publish/$slug"
            rsync -a --delete "$artifact/" "publish/$slug/"
            test -f "publish/$slug/index.html"
          done
          if test -d incoming/root; then
            for entry in publish/* publish/.[!.]*; do
              test -e "$entry" || continue
              case "${entry##*/}" in v*|main) continue ;; esac
              rm -rf "$entry"
            done
            rsync -a "incoming/root/" publish/
            test -f publish/index.html
           fi
           cp tooling/docs/CNAME publish/CNAME
           touch publish/.nojekyll
      - name: Publish complete documentation tree
        working-directory: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git checkout -b docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: publish versioned documentation"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin docs
