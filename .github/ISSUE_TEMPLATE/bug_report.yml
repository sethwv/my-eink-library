name: Bug report
description: Report something that is not working.
labels: [bug, triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Functional area
      options:
        - Library/indexing
        - Web UI/e-reader
        - Authentication/users
        - Downloads/KEPUB
        - Integrations
        - Deployment/docs
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
