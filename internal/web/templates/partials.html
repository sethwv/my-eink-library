{{define "topbar"}}
<header class="topbar">
  <h1 class="site-title"><a href="/">eink-library</a></h1>
  <nav class="topnav">
    <a href="/">Library</a>
    <a href="/authors">Authors</a>
    <a href="/series">Series</a>
    <a href="/favorites">Favourites</a>
  </nav>
  <div class="topbar-right">
    <span class="muted">{{.Username}}</span>
    {{if .IsAdmin}}<a href="/admin/users">Manage users</a>{{end}}

  </div>
</header>
{{end}}
