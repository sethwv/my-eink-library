{{define "topbar"}}
<header class="topbar">
  <div class="topbar-main">
    <h1 class="site-title"><a href="/">eink-library</a></h1>
    <nav class="topnav">
      <a href="/" title="Library">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="nav-label">Library</span>
      </a>
      <a href="/authors" title="Authors">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>
        <span class="nav-label">Authors</span>
      </a>
      <a href="/series" title="Series">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <span class="nav-label">Series</span>
      </a>
      <a href="/favorites" title="Favourites">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span class="nav-label">Favourites</span>
      </a>
    </nav>
  </div>
  <div class="topbar-right">
    <span class="muted">{{.Username}}</span>
    {{if .IsAdmin}}<a href="/admin/users">Manage users</a>{{end}}
    <form method="POST" action="/logout" class="inline-form"><button type="submit" class="btn-link">Log out</button></form>
  </div>
</header>
{{end}}
